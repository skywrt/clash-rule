allow-lan: false
port: 7890
socks-port: 7891
mode: rule
log-level: info
geodata-mode: true
geo-auto-update: true
geodata-loader: standard
geo-update-interval: 24
 
geox-url:
  geoip: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat
  geosite: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat
  mmdb: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb
  asn: https://github.com/xishang0128/geoip/releases/download/latest/GeoLite2-ASN.mmdb
 
proxy-providers:
  subscription:
    type: http
    url: "把订阅输入这里 保留引号"
    path: ./proxy_providers/default.yaml
    interval: 43200
    header:
      User-Agent:
        - "mihomo/1.19.0"
    health-check:
      enable: true
      url: https://cp.cloudflare.com/generate_204
      interval: 300
      timeout: 5000
      lazy: true
 
dns:
  enable: true
  listen: 0.0.0.0:1053
  cache-algorithm: arc
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "*.localhost"
    - "*.localdomain"
    - "*.home.arpa"
    - "*.msftconnecttest.com"
    - "*.msftncsi.com"
    - "localhost.ptlogin2.qq.com"
  ipv6: false
  respect-rules: true
  default-nameserver:
    - 223.5.5.5
    - 120.53.53.53
  nameserver:
    - https://120.53.53.53/dns-query
    - https://223.5.5.5/dns-query
  fallback:
    - https://dns.cloudflare.com/dns-query
    - https://dns.google/dns-query
  proxy-server-nameserver:
    - https://120.53.53.53/dns-query
    - https://223.5.5.5/dns-query
    - https://dns.cloudflare.com/dns-query
    - https://dns.google/dns-query
  direct-nameserver:
    - https://120.53.53.53/dns-query
    - https://223.5.5.5/dns-query
  direct-nameserver-follow-policy: true
  nameserver-policy:
    "geosite:cn,private":
      - https://120.53.53.53/dns-query
      - https://223.5.5.5/dns-query
    "geosite:geolocation-!cn":
      - https://dns.cloudflare.com/dns-query
      - https://dns.google/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
    geosite:
      - gfw
    ipcidr:
      - 240.0.0.0/4
    domain:
      - "+.google.com"
      - "+.facebook.com"
      - "+.youtube.com"
      - "+.openai.com"
 
tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  dns-hijack:
    - any:53
    - tcp://any:53
  strict-route: true
 
proxies:
  # 在这里添加自建节点；只要节点名称包含地区关键词，就会自动进入对应分组
  # 示例：
  # - name: 美国-自建01
  #   type: vmess
  #   server: example.com
  #   port: 443
  #   uuid: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
  #   alterId: 0
  #   cipher: auto
  #   tls: true
  #   servername: example.com
  #   network: ws
  #   ws-opts:
  #     path: /ws
  #     headers:
  #       host: example.com
  #   udp: true
 
proxy-groups:
  - name: 🚀 节点选择
    type: select
    proxies:
      - DIRECT
      - REJECT
      - ♻️ 自动选择
      - 🖐️ 手动选择
      - 香港自动
      - 香港手动
      - 日本自动
      - 日本手动
      - 新加坡自动
      - 新加坡手动
      - 美国自动
      - 美国手动
    use:
      - subscription
    include-all-proxies: true
 
  - name: ♻️ 自动选择
    type: url-test
    use:
      - subscription
    include-all-proxies: true
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 50
    lazy: false
 
  - name: 🖐️ 手动选择
    type: select
    use:
      - subscription
    include-all-proxies: true
 
  - name: 香港自动
